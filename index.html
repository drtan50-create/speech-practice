<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stroke Speech Practice — Roman Urdu</title>
<style>
  :root{--bg:#f7f7f9;--card:#ffffff;--accent:#0b6cff;--muted:#666;}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;}
  body{background:linear-gradient(180deg,#e9f0ff 0%,var(--bg) 60%);display:flex;align-items:center;justify-content:center;padding:18px;}
  .app{width:100%;max-width:720px;background:transparent;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  header h1{font-size:20px;margin:0;color:#073763;}
  .card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 6px 18px rgba(7,55,99,0.08);min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .title{font-weight:700;color:#073763;margin-bottom:8px;font-size:20px;text-align:center;}
  .lines{font-size:20px;color:#222;line-height:1.5;text-align:center;margin:8px 0;white-space:pre-wrap;}
  .muted{color:var(--muted);font-size:14px;margin-top:8px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
  button{background:var(--accent);color:white;border:none;padding:10px 14px;border-radius:10px;font-size:16px;cursor:pointer;min-width:88px;}
  button.secondary{background:#ffffff;color:#073763;border:1px solid #e0e6ef;}
  button:active{transform:translateY(1px);}
  .nav{display:flex;gap:10px;align-items:center;}
  .index{font-weight:600;color:#073763;font-size:15px;}
  .small{font-size:13px;padding:8px 10px;border-radius:8px;min-width:44px;}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .timer{font-weight:700;color:#073763;}
  footer{margin-top:12px;text-align:center;color:var(--muted);font-size:13px;}
  @media (max-width:420px){
    .lines{font-size:18px;}
    button{font-size:15px;padding:10px 12px;}
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Stroke Speech Practice">
    <header>
      <h1>Stroke Speech Practice (Roman Urdu)</h1>
      <div class="index" id="cardIndex">Card 1 / 8</div>
    </header>

    <main class="card" id="cardArea" tabindex="0">
      <div class="title" id="cardTitle">Saans aur Awaaz</div>
      <div class="lines" id="cardText">Gehri saans lo.
Saans chhor ke lambi "aaah" bolo.
3–4 dafa dohrao.</div>
      <div class="muted">Tip: 15 minute daily practice — 2–3 cards per session.</div>

      <div class="controls" style="margin-top:18px;">
        <div class="nav" role="navigation" aria-label="card navigation">
          <button id="prevBtn" class="secondary small" title="Previous (Left arrow)">Prev</button>
          <button id="nextBtn" class="secondary small" title="Next (Right arrow)">Next</button>
          <button id="randBtn" class="secondary small" title="Random card">Shuffle</button>
        </div>

        <div style="display:flex;gap:8px;align-items:center">
          <button id="speakBtn" title="Play (speech synthesis)">Play</button>
          <button id="startTimer" class="secondary" title="Start 15-minute timer">Start 15 min</button>
        </div>
      </div>

      <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;width:100%">
        <button id="copyBtn" class="secondary small">Copy</button>
        <button id="shareBtn" class="secondary small">Share</button>
        <button id="resetBtn" class="secondary small">Reset</button>
      </div>

      <div style="margin-top:12px">
        <div class="timer" id="timerDisplay" aria-live="polite">Timer: —</div>
      </div>
    </main>

    <footer>
      <div>Tip: On Android open this file in Chrome → menu → Add to Home screen.</div>
    </footer>
  </div>

<script>
const cards = [
  {title:"Saans aur Awaaz", text:"Gehri saans lo.\\nSaans chhor ke lambi \"aaah\" bolo.\\n3–4 dafa dohrao."},
  {title:"Honth (Lips)", text:"Muskarao phir hont gol karo (jaise kiss dena ho).\\nStraw sirf honton se pakro, dant istemal na karo.\\n5 second roko."},
  {title:"Zabaan (Tongue)", text:"Zabaan bahar nikalo, 2 second roko, phir andar.\\nZabaan daayein–baayein le jao.\\nZabaan upar–neeche karo.\\nDheere se bolo: \"la-la-la.\""},
  {title:"Jabda (Jaw)", text:"Mounh khol kar dheere se band karo.\\nJabda daayein–baayein hilaao.\\n5 martaba dohrao."},
  {title:"Awaaz Drill", text:"\"pa\" bolo 5 dafa.\\n\"ta\" bolo 5 dafa.\\n\"ka\" bolo 5 dafa.\\nPhir teenon saath dheere bolo: \"pa-ta-ka.\""},
  {title:"Alfaaz (Words)", text:"Saaf aur zor se bolo:\\nPaani\\nKitaab\\nGhar\\nShukriya\\nSalaam"},
  {title:"Jumlay (Sentences)", text:"\"Mujhe chai chahiye.\"\\n\"Aaj dhoop hai.\"\\n\"Main theek hoon.\"\\n\"Aap kaise ho?\"\\n\"Shukriya, Allah Hafiz.\""},
  {title:"Guftagu (Conversation)", text:"Dheere dheere bolo.\\nHar jumla ek saans mein bolo.\\nGhar walay sabr se sunain, beech mein baat na kaaten."}
];

let idx = 0;
const titleEl = document.getElementById('cardTitle');
const textEl = document.getElementById('cardText');
const indexEl = document.getElementById('cardIndex');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const randBtn = document.getElementById('randBtn');
const speakBtn = document.getElementById('speakBtn');
const copyBtn = document.getElementById('copyBtn');
const shareBtn = document.getElementById('shareBtn');
const resetBtn = document.getElementById('resetBtn');
const startTimer = document.getElementById('startTimer');
const timerDisplay = document.getElementById('timerDisplay');
const cardArea = document.getElementById('cardArea');

function render(i){
  const c = cards[i];
  titleEl.textContent = c.title;
  textEl.textContent = c.text;
  indexEl.textContent = `Card ${i+1} / ${cards.length}`;
  // focus so screen readers announce change
  cardArea.focus();
}
function prevCard(){ idx = (idx-1 + cards.length) % cards.length; render(idx); }
function nextCard(){ idx = (idx+1) % cards.length; render(idx); }
function randomCard(){ idx = Math.floor(Math.random()*cards.length); render(idx); }

prevBtn.addEventListener('click', prevCard);
nextBtn.addEventListener('click', nextCard);
randBtn.addEventListener('click', randomCard);
document.addEventListener('keydown', (e)=>{ if(e.key==='ArrowLeft') prevCard(); if(e.key==='ArrowRight') nextCard(); });

speakBtn.addEventListener('click', ()=>{
  const utter = new SpeechSynthesisUtterance(cards[idx].text.replace(/\\n/g,' '));
  // Try Urdu voice first
  utter.lang = 'ur-PK';
  // Fallback: let browser pick language if unavailable
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
});

copyBtn.addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(cards[idx].title + "\\n" + cards[idx].text.replace(/\\n/g,'\\n'));
    alert('Card text copied to clipboard');
  }catch(err){
    alert('Unable to copy — please select and copy manually.');
  }
});

shareBtn.addEventListener('click', async ()=>{
  const shareText = cards[idx].title + "\\n" + cards[idx].text.replace(/\\n/g,'\\n');
  if(navigator.share){
    navigator.share({title:'Stroke Speech Practice', text:shareText}).catch(()=>{});
  } else {
    try{ await navigator.clipboard.writeText(shareText); alert('Share text copied to clipboard'); }catch(err){ alert('Sharing not supported.'); }
  }
});

resetBtn.addEventListener('click', ()=>{ idx = 0; render(idx); stopTimer(); });

// Timer logic (15 minutes)
let timer = null;
let timeLeft = 0;
function start15(){ if(timer) return; timeLeft = 15*60; updateTimerDisplay(); timer = setInterval(()=>{ timeLeft--; updateTimerDisplay(); if(timeLeft<=0){ stopTimer(); alert('15 minute session finished'); } }, 1000); startTimer.textContent = 'Running...'; startTimer.disabled = true; }
function stopTimer(){ if(timer) clearInterval(timer); timer = null; timerDisplay.textContent = 'Timer: —'; startTimer.textContent = 'Start 15 min'; startTimer.disabled = false; }
function updateTimerDisplay(){ const m = Math.floor(timeLeft/60); const s = timeLeft%60; timerDisplay.textContent = 'Timer: ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }

startTimer.addEventListener('click', start15);

// Initialize first card
render(0);
</script>
</body>
</html>
